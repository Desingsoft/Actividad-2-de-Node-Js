<div class="auth-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Iniciar sesión</h2>

    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" formControlName="email" placeholder="correo@ejemplo.com">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" formControlName="password">
    </div>

    @if (mensajeInfo()) {
      <div class="info-alert">{{ mensajeInfo() }}</div>
    }
    @if (errorMsg()) {
      <div class="error-alert">{{ errorMsg() }}</div>
    }

    <button type="submit" [disabled]="loginForm.invalid || cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="auth-link">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </form>
</div>
